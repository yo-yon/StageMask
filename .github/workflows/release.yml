name: release

# テスト → exe の作成 → リリースページの作成までを自動で行う。始め方は2通り:
#  (A) GitHub の Actions タブ → release → Run workflow(ブラウザーやスマホから実行できる)
#      csproj の <Version> から v0.5.9 のようなタグを自動で作る
#  (B) タグを push する:  git tag v0.5.9  →  git push origin v0.5.9
#      タグの番号は src/StageMask.App/StageMask.App.csproj の <Version> と同じにすること(違うと止まる)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # リリースの作成に必要

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: バージョンとタグを決める
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content src/StageMask.App/StageMask.App.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ("v$version" -ne $tag) {
              Write-Error "タグ($tag)と csproj の Version(v$version)が一致しません。どちらかを直してください。"
              exit 1
            }
          } else {
            $tag = "v$version"
            # 同じ番号のリリースが既にあれば止める(上書きしない)
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Error "$tag のリリースは既にあります。csproj の Version を上げてから実行してください。"
              exit 1
            }
            $global:LASTEXITCODE = 0
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore StageMask.sln

      - name: Test (Core)
        run: dotnet test tests/StageMask.Core.Tests --no-restore --configuration Release

      - name: Publish (App, 自己完結型 x64)
        run: >
          dotnet publish src/StageMask.App/StageMask.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output publish

      - name: 配布用の exe を用意
        shell: pwsh
        run: |
          # ファイル名は版によらず同じにする。README の「最新版をダウンロード」のリンク
          # (releases/latest/download/StageMask-win-x64.exe)が、いつも最新版を指すようにするため。
          # どの版かは、リリースの名前と、起動後のタイトルバーの表示で分かる
          $name = "StageMask-win-x64.exe"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item publish/StageMask.exe -Destination dist/$name
          $hash = (Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath dist/$name.sha256 -Encoding ascii
          "ASSET=dist/$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: リリースを作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $notes = @"
          ## StageMask $tag (試作版)

          ### 使い方
          1. 下の「Assets」から ``StageMask-win-x64.exe`` をダウンロードします(最新版は README の「ダウンロード」からも入手できます)。
          2. ダブルクリックで起動します(展開や .NET のインストールは不要です)。
          3. 初回は Windows SmartScreen の警告が出ることがあります(署名なしの試作版のため)。「詳細情報」→「実行」で起動できます。
          4. 使い方は [README](https://github.com/${{ github.repository }}#readme) を参照してください。

          ### 確認用
          ``.sha256`` ファイルに exe の SHA-256 ハッシュ値を載せています。
          PowerShell で ``Get-FileHash .\StageMask-win-x64.exe`` を実行し、値が一致することを確認できます。

          ### 変更内容
          前の版からのコミット一覧は、このページ下部の自動生成部分を参照してください。
          "@
          # 「最新のリリース(Latest)」にする。プレリリースにすると releases/latest の対象にならず、
          # README のダウンロードのリンクが古い版を指してしまうため(試作版であることは名前に入れる)
          # (A) の場合はタグがまだないので、このコミットにタグを作る
          gh release create $tag "$env:ASSET" "$env:ASSET.sha256" `
            --target "${{ github.sha }}" `
            --title "StageMask $tag(試作版)" `
            --notes $notes `
            --generate-notes `
            --latest
