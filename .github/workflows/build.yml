name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StageMask.sln

      - name: Test (Core)
        run: dotnet test tests/StageMask.Core.Tests --no-restore --configuration Release

      - name: Publish (App, 自己完結型 x64)
        run: >
          dotnet publish src/StageMask.App/StageMask.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: StageMask-win-x64
          path: publish/
